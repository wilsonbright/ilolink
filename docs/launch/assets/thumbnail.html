<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 240px; height: 240px;
    background: #fafaf8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mark {
    width: 96px; height: 96px;
    border-radius: 24px;
    background: #3b5bdb;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(59,91,219,0.28);
  }
  /* a simple chain-link glyph in white */
  .mark svg { width: 52px; height: 52px; }
  .word { font-size: 34px; font-weight: 700; color: #1a1a17; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" />
        <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" />
      </svg>
    </div>
    <div class="word">ilolink</div>
  </div>
</body>
</html>
